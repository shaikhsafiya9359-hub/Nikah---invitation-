<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nikah Invitation — Safiya Shaikh & Hafiz Mohd. Umar Shaikh</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#170006}
body{font-family:Georgia,"Times New Roman",serif}
#app{position:fixed;inset:0;overflow:hidden;background:#170006}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}

/* FULL-SCREEN SEALED ENVELOPE */
#envelope{
  z-index:100;
  background:
    radial-gradient(circle at 50% 42%,rgba(120,10,35,.35),transparent 42%),
    linear-gradient(145deg,#220007,#650b25 48%,#240006);
}
.env-border{position:absolute;inset:16px;border:1px solid rgba(224,183,91,.7);pointer-events:none}
.env-texture{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(rgba(255,255,255,.35) .7px,transparent .7px);background-size:4px 4px}
.envelope-box{
  position:absolute;left:3.5%;right:3.5%;top:7%;bottom:7%;
  perspective:1200px;
}
.env-back{
  position:absolute;inset:0;
  background:linear-gradient(145deg,#5b0920,#7d102d 48%,#3a0614);
  border:2px solid rgba(215,173,82,.75);
  box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 35px rgba(0,0,0,.35);
}
.env-paper{
  position:absolute;left:8%;right:8%;top:25%;height:42%;
  background:#f7efe2;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  overflow:hidden;
}
.env-paper:before{
  content:"";position:absolute;left:0;right:0;top:0;border-top:3px solid #d3ad61;
}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:58%;
  background:linear-gradient(145deg,#6d0c29,#8b1536 52%,#5a0920);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-bottom:2px solid #d7b05f;
  transform-origin:50% 0;
  transition:transform 1.15s cubic-bezier(.2,.75,.2,1),filter 1.15s;
  z-index:4;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));
}
.env-flap:after{
  content:"";position:absolute;left:3%;right:3%;top:2%;height:96%;
  border-left:2px solid rgba(215,176,95,.85);
  border-right:2px solid rgba(215,176,95,.85);
  clip-path:polygon(0 0,100% 0,50% 100%);
}
.env-bismillah{
  position:absolute;top:17%;left:8%;right:8%;z-index:5;text-align:center;
  color:#f1d58b;font-size:clamp(20px,5vw,39px);line-height:1.2;
  direction:rtl;font-family:"Times New Roman",serif;font-weight:bold;
}
.env-english{
  position:absolute;top:34%;left:8%;right:8%;z-index:5;text-align:center;
  color:#f1d58b;font-size:clamp(13px,3.4vw,23px);line-height:1.45;
}
.gold-ornament{color:#e1bd6b;letter-spacing:7px;text-align:center}
.seal{
  position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
  width:min(31vw,155px);height:min(31vw,155px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c78c35,#8f5314 58%,#5d3007);
  border:8px solid #b97824;
  box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 0 0 3px #f0cb73,inset 0 0 0 8px #7b420d;
  z-index:8;cursor:pointer;transition:transform .25s;
}
.seal:before{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#f7d77e;font-size:42px}
.seal:after{content:"";position:absolute;inset:20%;border:1px solid #f0cb73;border-radius:50%}
.seal:active{transform:translate(-50%,-50%) scale(.94)}
.tap{
  position:absolute;z-index:9;left:0;right:0;bottom:10%;text-align:center;color:#f0cf86;
  letter-spacing:5px;font-size:clamp(13px,3.5vw,20px);
}
.tap small{display:block;margin-top:9px;letter-spacing:3px;font-size:clamp(11px,2.7vw,15px)}
.tap .finger{font-size:38px;margin-top:10px;display:block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translateY(-7px)}}

/* OPENING CARD */
#cardReveal{
  position:absolute;z-index:120;left:9%;right:9%;top:17%;bottom:17%;
  background:#f7efe2;border:2px solid #d3ad61;box-shadow:0 25px 55px rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform:translateY(115%) scale(.72);opacity:0;
}
#cardReveal .card-inner{padding:30px;color:#5b1020}
#cardReveal .card-inner .arabic{font-size:clamp(24px,7vw,46px);direction:rtl;font-weight:bold}
#cardReveal .card-inner h2{font-size:clamp(22px,7vw,38px);margin:18px 0 8px}
#cardReveal .card-inner p{font-size:clamp(13px,3.8vw,19px);margin:5px}
.opening #envelope .env-flap{transform:rotateX(178deg);filter:brightness(.8)}
.opening #envelope .seal{transform:translate(-50%,-50%) scale(.65);opacity:.15}
.opening #cardReveal{animation:cardPop 1.15s .65s cubic-bezier(.15,.8,.2,1) forwards}
@keyframes cardPop{
  0%{transform:translateY(115%) scale(.72);opacity:0}
  65%{transform:translateY(-3%) scale(1.02);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.opening #envelope{animation:fadeEnv 1s 1.55s forwards}
@keyframes fadeEnv{to{opacity:0;transform:scale(1.04)}}

/* PAGES */
#pages{z-index:10;opacity:0;pointer-events:none;transition:opacity .7s}
#pages.visible{opacity:1;pointer-events:auto}
#pageImg{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;inset:0;display:flex;justify-content:space-between;pointer-events:none}
.nav button{pointer-events:auto;align-self:center;width:48px;height:100px;border:0;background:rgba(40,0,10,.08);color:#fff;font-size:34px;text-shadow:0 2px 5px #000}
#counter{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:5px 11px;border-radius:20px;background:rgba(40,0,10,.35);color:#fff;font:12px Arial;opacity:.75}
#music{position:absolute;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;border:1px solid #d3ad61;background:#4b0a1b;color:#f2d383;font-size:22px}
</style>
</head>
<body>
<div id="app">

<section id="envelope" class="screen">
  <div class="env-border"></div><div class="env-texture"></div>
  <div class="envelope-box">
    <div class="env-back"></div>
    <div class="env-paper"></div>
    <div class="env-flap">
      <div class="env-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <div class="gold-ornament" style="position:absolute;top:28%;left:0;right:0">✦ ───── ❦ ───── ✦</div>
      <div class="env-english">In the Name of Allah,<br>the Most Gracious,<br>the Most Merciful.</div>
    </div>
    <div class="seal" id="seal" aria-label="Tap the seal"></div>
    <div class="tap">TAP THE SEAL<small>TO OPEN INVITATION</small><span class="finger">☝</span></div>
  </div>
</section>

<div id="cardReveal">
  <div class="card-inner">
    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    <h2>Nikah Invitation</h2>
    <p>Safiya Shaikh</p><p>&amp;</p><p>Hafiz Mohd. Umar Shaikh</p>
  </div>
</div>

<section id="pages" class="screen">
  <img id="pageImg" src="assets/page1.jpg" alt="Nikah invitation">
  <div id="counter">1 / 16</div>
  <div class="nav"><button id="prev">‹</button><button id="next">›</button></div>
  <button id="music">♪</button>
</section>

<audio id="audio" loop preload="auto" src="assets/music.mp3"></audio>
</div>

<script>
const app=document.getElementById('app');
const envelope=document.getElementById('envelope');
const card=document.getElementById('cardReveal');
const pages=document.getElementById('pages');
const pageImg=document.getElementById('pageImg');
const counter=document.getElementById('counter');
const audio=document.getElementById('audio');
const music=document.getElementById('music');
let page=1, opened=false;

function showPage(n){
  page=Math.max(1,Math.min(16,n));
  pageImg.src=`assets/page${page}.jpg`;
  counter.textContent=`${page} / 16`;
}
function openInvitation(){
  if(opened)return;
  opened=true;
  app.classList.add('opening');
  setTimeout(()=>{
    pages.classList.add('visible');
    showPage(1);
  },2350);
}
document.getElementById('seal').addEventListener('click',openInvitation);
document.getElementById('next').addEventListener('click',()=>showPage(page===16?1:page+1));
document.getElementById('prev').addEventListener('click',()=>showPage(page===1?16:page-1));

let sx=0;
pages.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
pages.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50)showPage(dx<0?(page===16?1:page+1):(page===1?16:page-1));
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')showPage(page===16?1:page+1);
  if(e.key==='ArrowLeft')showPage(page===1?16:page-1);
});

music.addEventListener('click',async()=>{
  if(audio.paused){try{await audio.play();music.textContent='❚❚'}catch(e){alert('Pehle GitHub me assets/music.mp3 upload karo.')}}else{audio.pause();music.textContent='♪'}
});
</script>
</body>
</html>
