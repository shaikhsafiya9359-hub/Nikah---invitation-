<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikah Invitation</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="envelope" onclick="openInvitation()">

    <div class="wax-seal">
        ﷽
    </div>

    <div class="flap"></div>

    <div class="letter">

        <h1>✨ Nikah Invitation ✨</h1>

        <h2>Bismillahir Rahmanir Rahim</h2>

        <p>
        Together with our families,
        we joyfully invite you to
        celebrate our Nikah.
        </p>

        <button class="open-btn">
            Open Invitation
        </button>

    </div>

</div>

<script>

function openInvitation(){

document.querySelector(".envelope").classList.add("opened");

setTimeout(()=>{
window.location.href="Nikah invitation";
},1200);

}

</script>

</body>
</html>
