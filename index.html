<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Safiya & Umar — Nikah Invitation</title>

<!-- Luxury wedding fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#170004;
}

body{
    font-family:"Cormorant Garamond",serif;
}

/* =========================
   MAIN SCREEN
========================= */

.invitation{
    width:100vw;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#260006;
}

/* Exact envelope image */
.envelope-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:2;
}

/* Dark luxury overlay */
.envelope-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(35,0,5,.08);
}

/* =========================
   GOLD SHINE
========================= */

.gold-shine{
    position:absolute;
    z-index:5;
    width:100%;
    height:2px;
    left:-100%;
    top:58%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,226,143,.9),
        transparent
    );
    filter:blur(.5px);
    animation:shine 4s ease-in-out infinite;
}

@keyframes shine{
    0%{left:-100%}
    55%,100%{left:100%}
}

/* =========================
   TAP AREA
========================= */

.seal-button{
    position:absolute;

    /*
      Approximate seal position
      on the supplied 853 x 1844 reference.
    */
    left:50%;
    top:61.5%;

    transform:translate(-50%,-50%);

    width:31vw;
    height:31vw;
    min-width:125px;
    min-height:125px;
    max-width:190px;
    max-height:190px;

    z-index:20;

    border:0;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

/* invisible but elegant tap pulse */
.seal-button::before{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1px solid rgba(255,215,120,.7);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(.88);
        opacity:0;
    }
    35%{
        opacity:.9;
    }
    100%{
        transform:scale(1.16);
        opacity:0;
    }
}

/* =========================
   OPENING FLAP EFFECT
========================= */

.opening-flap{
    position:absolute;
    z-index:30;

    left:0;
    top:7.2%;
    width:100%;
    height:49%;

    pointer-events:none;

    /*
      This creates the triangular flap movement
      over the original envelope artwork.
    */
    clip-path:polygon(
        0 0,
        100% 0,
        50% 100%
    );

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.03),
            transparent 35%,
            rgba(0,0,0,.18)
        );

    transform-origin:50% 100%;
    transform:perspective(900px) rotateX(0deg);
    transition:
        transform 1.45s cubic-bezier(.22,.75,.18,1),
        opacity .7s ease;
}

/* =========================
   OPENED STATE
========================= */

.invitation.opened .opening-flap{
    transform:
        perspective(900px)
        rotateX(-110deg);
    opacity:.2;
}

.invitation.opened .seal-button{
    animation:sealLift .7s ease forwards;
}

@keyframes sealLift{
    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-65%) scale(.75);
        opacity:0;
    }
}

/* =========================
   CARD REVEAL
========================= */

.inside-card{
    position:absolute;
    z-index:10;

    left:50%;
    top:51%;

    width:86%;
    height:72%;

    transform:
        translate(-50%,70%)
        scale(.82);

    opacity:0;

    background:
        linear-gradient(
            135deg,
            #f7efdc,
            #fffaf0 45%,
            #eee1c7
        );

    border:1px solid #b99752;

    box-shadow:
        0 20px 70px rgba(0,0,0,.65);

    transition:
        transform 1.5s cubic-bezier(.16,.8,.2,1),
        opacity .8s ease;
}

.invitation.opened .inside-card{
    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;
}

/* card decoration */
.inside-card::before{
    content:"";
    position:absolute;
    inset:10px;

    border:1px solid rgba(151,111,39,.65);

    pointer-events:none;
}

.card-content{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;
}

.card-content h2{
    font-family:"Amiri",serif;
    color:#6c1621;
    font-size:clamp(28px,8vw,50px);
}

.card-content p{
    margin-top:15px;

    font-family:"Cormorant Garamond",serif;

    color:#4b2921;

    font-size:clamp(17px,4.5vw,25px);

    letter-spacing:.04em;
}

/* =========================
   CONTINUE
========================= */

.continue{
    position:absolute;
    z-index:40;

    bottom:7%;
    left:50%;

    transform:translateX(-50%);

    width:100%;

    text-align:center;

    font-family:"Cinzel",serif;

    color:#f3d17a;

    font-size:clamp(11px,3vw,17px);

    letter-spacing:.28em;

    text-shadow:
        0 0 12px rgba(255,211,110,.35);

    animation:continuePulse 2s infinite;
}

@keyframes continuePulse{
    0%,100%{
        opacity:.65;
        transform:translateX(-50%) translateY(0);
    }

    50%{
        opacity:1;
        transform:translateX(-50%) translateY(-5px);
    }
}

/* =========================
   NEXT PAGE
========================= */

.next-page{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f7efdc;

    transform:translateY(100%);
    transition:
        transform 1.1s cubic-bezier(.2,.8,.2,1);
}

.invitation.show-next .next-page{
    transform:translateY(0);
}

.next-page-inner{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;
}

.next-page-inner h1{
    font-family:"Great Vibes",cursive;

    font-size:clamp(48px,14vw,90px);

    color:#651a24;

    font-weight:400;
}

.next-page-inner p{
    margin-top:10px;

    font-family:"Cormorant Garamond",serif;

    font-size:clamp(18px,5vw,27px);

    color:#4c2a22;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .inside-card{
        width:88%;
        height:70%;
    }

    .seal-button{
        top:61%;
    }
}
</style>
</head>


<body>

<div class="invitation" id="invitation">

    <!-- YOUR EXACT ENVELOPE IMAGE -->
    <img
        class="envelope-photo"
        src="envelope.png"
        alt="Luxury Maroon Wedding Envelope"
    >

    <div class="gold-shine"></div>

    <!-- Animated triangular flap -->
    <div class="opening-flap"></div>

    <!-- Card hidden inside envelope -->
    <div class="inside-card">
        <div class="card-content">
            <div>
                <h2>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</h2>

                <p>
                    With the Blessings<br>
                    of Allah
                </p>
            </div>
        </div>
    </div>

    <!-- TAP AREA OVER WAX SEAL -->
    <button
        class="seal-button"
        id="sealButton"
        aria-label="Open invitation">
    </button>

    <div class="continue">
        TAP THE SEAL TO OPEN INVITATION
    </div>


    <!-- NEXT PAGE -->
    <section class="next-page" id="nextPage">

        <div class="next-page-inner">

            <div>
                <h1>Nikah</h1>

                <p>
                    With the Blessings of Allah
                </p>
            </div>

        </div>

    </section>

</div>


<script>

const invitation = document.getElementById("invitation");
const sealButton = document.getElementById("sealButton");
const nextPage = document.getElementById("nextPage");

let opened = false;

sealButton.addEventListener("click", function(){

    if(opened) return;

    opened = true;

    /*
      1. Open triangular flap
      2. Lift seal
      3. Bring card forward
    */
    invitation.classList.add("opened");

    /*
      After opening animation,
      move to next page.
    */
    setTimeout(() => {

        invitation.classList.add("show-next");

    }, 2200);

});

</script>

</body>
</html>
