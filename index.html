<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Safiya Shaikh | Nikah Invitation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#210006;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
   ENVELOPE SCREEN
========================= */

#envelopeScreen{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 50% 35%,rgba(150,20,45,.35),transparent 38%),
    linear-gradient(145deg,#170004,#4b0717 48%,#210006);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:100;
}

.gold-border{
  position:absolute;
  inset:18px;
  border:1px solid rgba(225,177,76,.75);
  pointer-events:none;
}

.gold-border:before,
.gold-border:after{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  border:1px solid rgba(225,177,76,.55);
}

.gold-border:before{
  left:-1px;
  top:-1px;
  border-right:0;
  border-bottom:0;
}

.gold-border:after{
  right:-1px;
  bottom:-1px;
  border-left:0;
  border-top:0;
}

.envelope{
  position:relative;
  width:min(88vw,430px);
  height:min(72vh,560px);
  perspective:1200px;
}

/* back */
.env-back{
  position:absolute;
  inset:0;
  background:
    linear-gradient(145deg,#6e0d27,#3d0615 50%,#690b25);
  border:2px solid rgba(225,177,76,.65);
  border-radius:4px;
  box-shadow:
    0 25px 55px rgba(0,0,0,.65),
    inset 0 0 35px rgba(0,0,0,.35);
}

/* subtle fabric */
.env-back:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.12;
  background:
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.15) 4px
    );
}

/* paper/card inside */
.inner-card{
  position:absolute;
  left:7%;
  right:7%;
  top:17%;
  height:66%;
  background:#fff8e9;
  border:1px solid #d9b46a;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#5b0b1b;
  overflow:hidden;
  z-index:2;
}

.inner-card-content{
  padding:20px;
}

.inner-card .small{
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:16px;
}

.inner-card h1{
  font-size:32px;
  font-style:italic;
  font-weight:normal;
  margin-bottom:10px;
}

.inner-card p{
  font-size:13px;
  letter-spacing:2px;
}

/* top flap */
.flap{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:57%;
  background:
    linear-gradient(145deg,#850f32,#57081f 50%,#8e1238);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  z-index:6;
  transition:
    transform 1.25s cubic-bezier(.22,.75,.2,1),
    opacity .6s ease;
  border-top:2px solid rgba(225,177,76,.65);
}

.flap:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:8%;
  bottom:5%;
  border-left:1px solid rgba(225,177,76,.45);
  border-right:1px solid rgba(225,177,76,.45);
}

/* bottom pocket */
.pocket{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:57%;
  background:
    linear-gradient(145deg,#760d2b,#47071a 55%,#720c2b);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
  z-index:5;
  border-bottom:2px solid rgba(225,177,76,.55);
}

/* envelope text */
.env-title{
  position:absolute;
  z-index:8;
  top:12%;
  left:10%;
  right:10%;
  text-align:center;
  color:#f2d58b;
  letter-spacing:4px;
  font-size:13px;
}

.env-title strong{
  display:block;
  font-size:22px;
  letter-spacing:3px;
  margin-bottom:7px;
  font-weight:normal;
}

.tap-text{
  position:absolute;
  z-index:12;
  bottom:9%;
  left:0;
  right:0;
  text-align:center;
  color:#e7c776;
  letter-spacing:4px;
  font-size:13px;
}

.tap-text span{
  display:block;
  font-size:10px;
  letter-spacing:3px;
  margin-top:10px;
  opacity:.9;
}

/* =========================
   WAX SEAL
========================= */

.seal{
  position:absolute;
  z-index:15;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  width:105px;
  height:105px;
  border-radius:50%;
  cursor:pointer;

  background:
    radial-gradient(circle at 35% 30%,#d98a76,#9b243d 30%,#65091f 72%,#400512);

  border:4px solid #d9ae54;

  box-shadow:
    0 7px 15px rgba(0,0,0,.55),
    inset 0 0 0 3px rgba(255,220,130,.25),
    inset 0 0 20px rgba(0,0,0,.45);

  transition:
    transform .35s ease,
    opacity .5s ease;
}

.seal:before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid #f0cf79;
  border-radius:50%;
}

.seal:after{
  content:"✦";
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#f5d78a;
  font-size:40px;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
}

.seal:active{
  transform:translate(-50%,-50%) scale(.92);
}

/* opening */
.open .flap{
  transform:rotateX(165deg);
  opacity:.2;
}

.open .seal{
  transform:translate(-50%,-50%) scale(1.5);
  opacity:0;
}

.open .tap-text{
  opacity:0;
}

/* card popup */
.open .inner-card{
  animation:cardPop 1.1s .25s cubic-bezier(.2,.9,.25,1) both;
}

@keyframes cardPop{
  0%{
    transform:translateY(80px) scale(.75);
    opacity:0;
  }
  65%{
    transform:translateY(-20px) scale(1.04);
    opacity:1;
  }
  100%{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

/* =========================
   INVITATION PAGES
========================= */

#pages{
  position:fixed;
  inset:0;
  background:#160003;
  display:none;
  z-index:50;
}

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#160003;

  opacity:0;
  visibility:hidden;
  transform:translateX(40px) scale(.98);

  transition:
    opacity .55s ease,
    transform .55s ease,
    visibility .55s;
}

.page.active{
  opacity:1;
  visibility:visible;
  transform:translateX(0) scale(1);
}

.page img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* navigation */
.nav{
  position:fixed;
  z-index:80;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
  opacity:.8;
}

.nav button{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,220,140,.6);
  background:rgba(50,0,10,.6);
  color:#f0cd78;
  font-size:18px;
}

.counter{
  color:#e9c873;
  font-size:11px;
  letter-spacing:2px;
  min-width:55px;
  text-align:center;
}

/* first page loading */
#loading{
  position:fixed;
  inset:0;
  z-index:200;
  background:#170004;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#e9c873;
  letter-spacing:4px;
}

.loader-line{
  width:160px;
  height:2px;
  background:rgba(233,200,115,.2);
  margin-top:18px;
  overflow:hidden;
}

.loader-line div{
  height:100%;
  width:0;
  background:#e9c873;
  animation:load 1.5s ease forwards;
}

@keyframes load{
  to{width:100%}
}

/* mobile */
@media(max-width:480px){
  .envelope{
    width:88vw;
    height:70vh;
  }

  .seal{
    width:92px;
    height:92px;
  }

  .env-title{
    font-size:11px;
  }

  .env-title strong{
    font-size:19px;
  }
}
</style>
</head>

<body>

<!-- =========================
     ENVELOPE
========================= -->

<section id="envelopeScreen">

  <div class="gold-border"></div>

  <div class="envelope" id="envelope">

    <div class="env-back"></div>

    <div class="inner-card">
      <div class="inner-card-content">
        <div class="small">NIKAH INVITATION</div>
        <h1>Safiya Shaikh</h1>
        <p>With the blessings of Allah</p>
      </div>
    </div>

    <div class="pocket"></div>

    <div class="flap"></div>

    <div class="env-title">
      <strong>SAFIYA SHAIKH</strong>
      NIKAH INVITATION
    </div>

    <div class="seal" id="seal" aria-label="Open invitation"></div>

    <div class="tap-text">
      TAP THE SEAL
      <span>TO OPEN INVITATION</span>
    </div>

  </div>
</section>


<!-- =========================
     INVITATION PAGES
========================= -->

<section id="pages">

  <div class="page active">
    <img src="page_01.png" alt="Invitation Page 1">
  </div>

  <div class="page">
    <img src="page_02.png" alt="Invitation Page 2">
  </div>

  <div class="page">
    <img src="page_03.png" alt="Invitation Page 3">
  </div>

  <div class="page">
    <img src="page_04.png" alt="Invitation Page 4">
  </div>

  <div class="page">
    <img src="page_05.png" alt="Invitation Page 5">
  </div>

  <div class="page">
    <img src="page_06.png" alt="Invitation Page 6">
  </div>

  <div class="page">
    <img src="page_07.png" alt="Invitation Page 7">
  </div>

  <div class="page">
    <img src="page_08.png" alt="Invitation Page 8">
  </div>

  <div class="page">
    <img src="page_09.png" alt="Invitation Page 9">
  </div>

  <div class="page">
    <img src="page_10.png" alt="Invitation Page 10">
  </div>

  <div class="page">
    <img src="page_11.png" alt="Invitation Page 11">
  </div>

  <div class="page">
    <img src="page_12.png" alt="Invitation Page 12">
  </div>

  <div class="page">
    <img src="page_13.png" alt="Invitation Page 13">
  </div>

  <div class="page">
    <img src="page_14.png" alt="Invitation Page 14">
  </div>

  <div class="page">
    <img src="page_15.png" alt="Invitation Page 15">
  </div>

  <div class="page">
    <img src="page_16.png" alt="Invitation Page 16">
  </div>

  <div class="nav">
    <button id="prev">‹</button>
    <div class="counter" id="counter">1 / 16</div>
    <button id="next">›</button>
  </div>

</section>


<!-- =========================
     LOADING
========================= -->

<div id="loading">
  <div>OPENING INVITATION</div>
  <div class="loader-line">
    <div></div>
  </div>
</div>


<script>

const envelopeScreen = document.getElementById("envelopeScreen");
const envelope = document.getElementById("envelope");
const seal = document.getElementById("seal");
const pages = document.getElementById("pages");
const pageElements = document.querySelectorAll(".page");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const loading = document.getElementById("loading");

let currentPage = 0;
let opened = false;


/* =========================
   OPEN ENVELOPE
========================= */

seal.addEventListener("click", openEnvelope);

function openEnvelope(){

  if(opened) return;

  opened = true;

  envelope.classList.add("open");

  /*
    Envelope opens first.
    Then pages appear.
  */

  setTimeout(() => {

    envelopeScreen.style.transition =
      "opacity .8s ease, transform .8s ease";

    envelopeScreen.style.opacity = "0";
    envelopeScreen.style.transform = "scale(1.04)";

  },1200);

  setTimeout(() => {

    envelopeScreen.style.display = "none";

    pages.style.display = "block";

    currentPage = 0;
    showPage(currentPage);

  },1900);
}


/* =========================
   PAGE CONTROL
========================= */

function showPage(index){

  if(index < 0) index = 0;

  if(index >= pageElements.length){
    index = pageElements.length - 1;
  }

  currentPage = index;

  pageElements.forEach((page,i)=>{
    page.classList.toggle("active",i === currentPage);
  });

  counter.textContent =
    (currentPage + 1) + " / " + pageElements.length;
}


next.addEventListener("click",()=>{
  if(currentPage < pageElements.length - 1){
    showPage(currentPage + 1);
  }
});

prev.addEventListener("click",()=>{
  if(currentPage > 0){
    showPage(currentPage - 1);
  }
});


/* =========================
   TAP RIGHT / LEFT
========================= */

pages.addEventListener("click",(e)=>{

  if(e.target.closest(".nav")) return;

  const x = e.clientX;
  const width = window.innerWidth;

  if(x > width * .55){
    if(currentPage < pageElements.length - 1){
      showPage(currentPage + 1);
    }
  }

  else if(x < width * .45){
    if(currentPage > 0){
      showPage(currentPage - 1);
    }
  }

});


/* =========================
   SWIPE
========================= */

let touchStartX = 0;
let touchEndX = 0;

pages.addEventListener("touchstart",(e)=>{
  touchStartX = e.changedTouches[0].screenX;
},{passive:true});

pages.addEventListener("touchend",(e)=>{

  touchEndX = e.changedTouches[0].screenX;

  const difference = touchStartX - touchEndX;

  if(Math.abs(difference) < 50) return;

  if(difference > 0){
    if(currentPage < pageElements.length - 1){
      showPage(currentPage + 1);
    }
  }else{
    if(currentPage > 0){
      showPage(currentPage - 1);
    }
  }

},{passive:true});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",(e)=>{

  if(e.key === "ArrowRight"){
    if(currentPage < pageElements.length - 1){
      showPage(currentPage + 1);
    }
  }

  if(e.key === "ArrowLeft"){
    if(currentPage > 0){
      showPage(currentPage - 1);
    }
  }

});

</script>

</body>
</html>
